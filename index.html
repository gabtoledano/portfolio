    <!--
      Thème appliqué avant le premier rendu. Sans ce script, la page peut
      s'afficher dans un thème puis basculer dans l'autre une fois React monté :
      un flash visible à chaque chargement. La clé et le défaut doivent rester
      alignés sur THEME_STORAGE_KEY et DEFAULT_PREFERENCE.
    -->
    <script>
      (function () {
        try {
          var raw = localStorage.getItem("gt-theme");
          var preference = raw ? JSON.parse(raw) : "dark";
          var explicit = preference === "light" || preference === "dark";
          var theme = explicit
            ? preference
            : window.matchMedia("(prefers-color-scheme: light)").matches
              ? "light"
              : "dark";
          document.documentElement.dataset.theme = theme;
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute("content", theme === "light" ? "#f5f6fb" : "#0a0a14");
        } catch (error) {
          document.documentElement.dataset.theme = "dark";
        }
      })();
    </script>
